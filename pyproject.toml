[tool.poetry]
name = "garmin-local-export-tools"
version = "0.1.0"
description = "Local Garmin Connect export and summarization tools."
authors = ["Vladimir Soskin"]
packages = [{ include = "cli" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
garminconnect = "^0.3.5"

[tool.poetry.scripts]
garmin-export = "cli.entrypoints:garmin_export"
backfill = "cli.entrypoints:backfill"
weekly = "cli.entrypoints:weekly"
summarize = "cli.entrypoints:summarize"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
